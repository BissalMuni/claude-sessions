<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <title>claude-sessions</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 토큰 입력 게이트 -->
    <div id="gate" class="gate">
      <div class="gate-box">
        <h1>claude-sessions</h1>
        <p>서버 콘솔에 출력된 토큰을 입력하세요.</p>
        <input id="token-input" type="text" inputmode="text" placeholder="토큰" autocomplete="off" />
        <button id="token-btn">접속</button>
        <div id="gate-err" class="err"></div>
      </div>
    </div>

    <!-- 메인 -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <button id="list-btn" class="ghost tb-btn">◀ 목록</button>
        <button id="new-btn" class="ghost tb-btn">New</button>
        <!-- 세션 동작 버튼: 세션이 선택됐을 때만 보인다(render 에서 토글) -->
        <button id="tb-interrupt" class="ghost tb-btn tb-sess hidden">중단</button>
        <button id="tb-reset" class="ghost tb-btn tb-sess hidden" title="이 세션을 닫고 같은 폴더로 새 세션 열기(대화/컨텍스트 초기화)">리셋</button>
        <button id="tb-remove" class="ghost tb-btn tb-sess hidden">종료</button>
      </header>

      <main class="layout">
        <aside id="list" class="list"></aside>
        <section id="detail" class="detail">
          <div class="empty">세션을 선택하거나 새로 만드세요.</div>
        </section>
      </main>
    </div>

    <!-- 새 세션 모달 -->
    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <div class="modal-head">
          <h2>새 세션</h2>
          <div class="modal-head-actions">
            <button id="modal-cancel" class="ghost">취소</button>
            <button id="modal-create">생성</button>
          </div>
        </div>
        <label>작업 폴더 (cwd)</label>
        <div class="picker">
          <div id="picker-here" class="picker-here">/</div>
          <div id="picker-list" class="picker-list"></div>
        </div>
        <div id="picker-sel" class="picker-sel hidden"></div>
        <input id="cwd-input" type="text" placeholder="폴더를 고르거나 직접 입력" autocomplete="off" />
        <label>제목 (선택)</label>
        <input id="title-input" type="text" placeholder="비우면 폴더명" autocomplete="off" />
        <div id="modal-err" class="err"></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
